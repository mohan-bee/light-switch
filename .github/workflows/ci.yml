name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPO_NO_TELEMETRY: '1'

jobs:
  checks:
    name: Frontend and API checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Lint, type-check, and bundle the web preview
        working-directory: frontend
        run: |
          npm run lint
          npm run typecheck
          npx expo export --platform web
      - name: Run API tests
        run: node --test api/*.test.cjs

  android:
    name: Android APK
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
      - name: Install Android SDK components
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            'platforms;android-37.0' \
            'build-tools;36.0.0' \
            'build-tools;37.0.0' \
            'ndk;27.1.12297006' \
            'cmake;3.22.1'
      - name: Generate the native Android project
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx expo prebuild --platform android --no-install
      - name: Assemble the standalone ARM64 APK
        working-directory: frontend/android
        run: |
          ./gradlew :app:assembleRelease --max-workers=2 \
            -PreactNativeArchitectures=arm64-v8a \
            -Pandroid.enableMinifyInReleaseBuilds=false
      - name: Verify the APK signature and embedded app
        working-directory: frontend/android
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose "$apk"
          unzip -tq "$apk" assets/index.android.bundle
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: light-switch-arm64
          path: frontend/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
